# SearXNG Configuration for Berb
# Optimized for academic research

use_default_settings: true

general:
  debug: false
  instance_name: "Berb Search"
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "BERB_SECRET_KEY_CHANGE_THIS_IN_PRODUCTION"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.0"
  method: "POST"
  bind_address: "0.0.0.0"
  port: 8080

outgoing:
  request_timeout: 30.0
  max_request_timeout: 60.0
  useragent_suffix: "Berb/1.0"
  enable_http2: true

ui:
  default_theme: simple
  default_locale: en
  query_in_title: true
  infinite_scroll: true
  center_alignment: true
  autocomplete_min: 4
