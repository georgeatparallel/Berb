name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (no LLM, no e2e, no slow)
        run: |
          # RATCHET ONLY. Never lower this to make a build pass — add tests.
          #
          # A4-5 raised this 55 -> 62. Measured coverage is now 64% (up from
          # ~57-58% when the floor was last set), so 62 keeps a ~2-point
          # buffer for run-to-run variance from skipped/flaky tests.
          #
          # The plan called for 70 here, on the assumption that Waves S-3
          # would carry coverage that far. They did not — those waves shipped
          # focused security and architecture tests, not broad coverage — so
          # 70 would fail CI on the first commit. Reaching 70 needs tests for
          # berb/writing/ and the other 0%-covered modules, not a higher
          # number here.
          pytest tests/ \
            -m "not slow and not e2e and not llm" \
            --tb=short \
            -q \
            --cov=berb \
            --cov-fail-under=62 \
            --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check berb/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check berb/ tests/

      - name: Reachability (dead-code ratchet)
        run: |
          # RATCHET ONLY. Never raise --max-unreachable-loc to make a build
          # pass — wire the module, delete it, or park it in
          # .reachability-allowlist with an ID and a revisit date
          # (tasks/dead_code_wiring_plan.md).
          #
          # 1522 = 23540 unreachable LOC minus 22018 allowlisted, measured
          # 2026-09-02. `from berb.literature import ...` and
          # `from berb.llm import ...` are supported contracts, so the modules
          # behind those packages' __all__ are entry points
          # (PUBLIC_API_PACKAGES in the script).
          # tests/test_public_api_contract.py is what watches those APIs now
          # that this gate does not.
          #
          # What is left is exactly three modules, all blocked on a decision
          # rather than on analysis: experiment/code_agent.py (held),
          # react_agent.py and split_policy.py (both pending wiring).
          #
          # Trajectory: 30658 (W0 corrected the checker) -> 25990 -> 24966 (W1)
          # -> 20378 (W2) -> 17403 (W3) -> 10977 (W4) -> 5888 -> 1522.
          #
          # Keep the flag and this comment in step. They drifted once already:
          # W1 set the flag to 25990, then W2 and W3 edited only the comment, so
          # CI enforced 25990 for three commits. The flag is what runs.
          python scripts/check_reachability.py \
            --allowlist .reachability-allowlist \
            --max-unreachable-loc 1522

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mypy
        run: mypy berb/ --python-version 3.11

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "bandit[toml]" pip-audit

      # BLOCKING as of A4-5: the 41-finding baseline was triaged. Two were
      # real and are fixed (eval on paper-derived expressions, exec on
      # paper-derived code — both now AST-gated); one weak-hash finding was
      # marked usedforsecurity=False; one bind-all default was moved to
      # loopback. The rest are category decisions documented, with reasons,
      # in [tool.bandit] in pyproject.toml. Do NOT re-add continue-on-error
      # to make a build pass — triage the new finding instead.
      - name: Bandit (static security scan)
        run: bandit -r berb/ -ll -c pyproject.toml

      - name: pip-audit (dependency vulnerability scan)
        continue-on-error: true
        run: pip-audit --strict
