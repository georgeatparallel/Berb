[project]
name = "berb-research"
version = "1.0.0"
description = "Berb — Research, Refined. AI-powered research automation with 85% cost reduction."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "arxiv>=2.1",
    "numpy>=1.24",
    "httpx>=0.24",
    "pydantic>=2.0",
    # P0 2026-04-06: Fix dependency warnings
    "requests>=2.32.0",
    "urllib3>=2.2.0,<3.0.0",
    "charset-normalizer>=3.3.0",
    "python-dotenv>=1.0.0",
]
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Georgios-Chrysovalantis Chatzivantsidis", email = "berb-support@example.com"}
]
keywords = [
    "research",
    "automation",
    "AI",
    "literature-review",
    "paper-writing",
    "academic",
    "self-improving",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai = ["openai>=1.0"]
deepseek = ["openai>=1.0"]  # Uses OpenAI-compatible API
perplexity = []  # Built-in
xai = []  # Built-in
# Web stack: search/scraping providers plus the `berb serve` HTTP server.
# berb/cli.py points users here on ImportError, so the server deps must live here.
web = [
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.7",  # required by the Form/File upload routes
]
pdf = ["PyMuPDF>=1.23"]
all = [
    "anthropic>=0.20",
    "openai>=1.0",
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "PyMuPDF>=1.23",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.7",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "mypy>=1.15",
    "scipy>=1.10",
    # Upper bound is deliberate: ruff's formatter changes between minor
    # versions, so an unpinned range lets CI fail on a version bump with no
    # code change. Raise both bounds together after running `ruff format`.
    "ruff>=0.15,<0.16",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.7",
]

[project.scripts]
berb = "berb.cli:main"

[project.urls]
Homepage = "https://github.com/georgehadji/berb"
Documentation = "https://github.com/georgehadji/berb/docs"
Repository = "https://github.com/georgehadji/berb"
Issues = "https://github.com/georgehadji/berb/issues"
Changelog = "https://github.com/georgehadji/berb/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["berb"]

[tool.hatch.build.targets.wheel.force-include]
"berb/templates/styles" = "berb/templates/styles"
"berb/data" = "berb/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests",
    "llm: tests requiring LLM API access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# berb/data/ holds LLM-facing reference content, not source. Newer ruff
# versions format code blocks inside Markdown, which would rewrite the
# examples the model is shown. Keep the formatter out of it.
extend-exclude = ["berb/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# N806 (non-lowercase variables) allowed in scientific modules
# Standard notation in chaos theory/physics: D2, C_m, C_r, q_matrix, etc.
"berb/experiment/*" = ["N806"]
# N806 false positives for module-level constants in pipeline/templates
"berb/pipeline/*" = ["N806"]
"berb/templates/*" = ["N806"]
"berb/literature/*" = ["N806"]
"berb/llm/*" = ["N806"]
"berb/evolution.py" = ["N806"]
# Test classes/functions follow ticket-number naming (TestIMP14_15_Integration)
# and reuse math notation from the modules under test; not bugs.
"tests/*" = ["N801", "N802", "N803", "N806", "E741"]
# Blanket ignores for widespread false positives
"berb/audit/reproducibility.py" = ["N806", "N801", "N802"]
"berb/benchmarks/runner.py" = ["N806", "N801", "N802"]
"berb/experiment/docker_sandbox.py" = ["N806", "N801", "N802"]
