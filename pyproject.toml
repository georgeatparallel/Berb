"berb/llm/model_cascade.py" = ["N806", "N801", "N802"]
"berb/llm/retry_utils.py" = ["N806", "N801", "N802"]
"berb/memory/shared_memory.py" = ["N806", "N801", "N802"]
"berb/pipeline/_figure_helpers.py" = ["N806", "N801", "N802"]
"berb/pipeline/_io_helpers.py" = ["N806", "N801", "N802"]
"berb/pipeline/_prompt_helpers.py" = ["N806", "N801", "N802"]
"berb/pipeline/citation_verification.py" = ["N806", "N801", "N802"]
"berb/pipeline/executor.py" = ["N806", "N801", "N802"]
"berb/pipeline/opencode_bridge.py" = ["N806", "N801", "N802"]
"berb/pipeline/resolution.py" = ["N806", "N801", "N802"]
"berb/pipeline/runner.py" = ["N806", "N801", "N802"]
"berb/review/cross_model_reviewer.py" = ["N806", "N801", "N802"]
"berb/skills/registry.py" = ["N806", "N801", "N802"]
"berb/web/firecrawl_client.py" = ["N806", "N801", "N802"]
"berb/web/scholar.py" = ["N806", "N801", "N802"]
"berb/writing/academic_polisher.py" = ["N806", "N801", "N802"]
"berb/writing/anti_ai.py" = ["N806", "N801", "N802"]
"berb/writing/citation_engine.py" = ["N806", "N801", "N802"]
"berb/writing/citation_styles.py" = ["N806", "N801", "N802"]
"berb/writing/impact_assessment.py" = ["N806", "N801", "N802"]
