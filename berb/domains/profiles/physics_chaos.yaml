# Physics Domain - Chaos Detection Profile
---
domain_id: physics_chaos
display_name: "Physics - Chaos & Nonlinear Dynamics"
experiment_paradigm: "Numerical simulation"
core_libraries:
  - numpy
  - scipy

description: |
  Chaos detection and analysis for nonlinear dynamical systems.

keywords:
  - Lyapunov exponents
  - Bifurcation diagrams
  - Poincaré sections
  - Strange attractors
  - Period doubling
  - Chaos theory

benchmark_systems:
  lorenz_63:
    system: lorenz
    parameters:
      sigma: 10.0
      rho: 28.0
      beta: 2.667
    expected_lyapunov:
      lambda1: 0.9056
      lambda2: 0.0
      lambda3: -14.572

  henon_heiles:
    system: henon_heiles
    parameters:
      energy_range: [0.0833, 0.1667]
    transition_energy: 0.1667
    expected_behavior:
      below_transition: regular
      above_transition: chaotic

  double_pendulum:
    system: double_pendulum
    parameters:
      m1: 1.0
      m2: 1.0
      l1: 1.0
      l2: 1.0
    expected_behavior: chaotic

integration_methods:
  - "Velocity Verlet (2nd order)"
  - "Yoshida (4th order symplectic)"

analysis_tools:
  - Lyapunov exponent computation
  - Bifurcation diagram generation
  - Poincaré section computation
  - Phase space visualization
  - Energy drift monitoring
