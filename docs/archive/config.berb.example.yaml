# Berb Configuration - Example Template
# Copy this file to config.berb.yaml and customize

project:
  name: "my-research"
  mode: "full-auto"  # "docs-first" | "semi-auto" | "full-auto"

research:
  topic: "Your research topic here"
  domains:
    - "machine-learning"
  daily_paper_count: 10
  quality_threshold: 4.0

runtime:
  timezone: "UTC"
  max_parallel_tasks: 1
  approval_timeout_hours: 12
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: false
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

# ============================================================================
# LLM Configuration
# ============================================================================

llm:
  provider: "openai-compatible"
  base_url: "https://api.openai.com/v1"
  wire_api: "chat_completions"
  api_key_env: "OPENAI_API_KEY"
  primary_model: "gpt-4o"
  fallback_models: []

# ============================================================================
# Experiment Configuration
# ============================================================================

experiment:
  mode: "sandbox"  # "simulated" | "sandbox" | "docker" | "ssh_remote" | "colab_drive"
  time_budget_sec: 300
  max_iterations: 10
  metric_key: "primary_metric"
  metric_direction: "minimize"

  sandbox:
    python_path: ".venv/Scripts/python.exe"  # Windows
    # python_path: ".venv/bin/python3"  # Linux/Mac
    gpu_required: false
    max_memory_mb: 4096

# ============================================================================
# Security
# ============================================================================

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

# ============================================================================
# Web Search Configuration
# ============================================================================

web_search:
  enabled: true
  tavily_api_key_env: "TAVILY_API_KEY"
  enable_scholar: true
  enable_crawling: true
  enable_pdf_extraction: true
  max_web_results: 10
  max_scholar_results: 10
  max_crawl_urls: 5